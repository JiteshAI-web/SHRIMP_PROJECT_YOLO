# YOLOv8 Dataset Configuration for Shrimp Detection
# Dataset: 247 train + 27 valid images (Roboflow export)
# Omitting 'path' allows Ultralytics to resolve train/val relative to this YAML's directory,
# making it completely portable across all environments and working directories.

train: train/images  # train images (247 images)
val: valid/images    # validation images (27 images)

# Classes
nc: 1  # number of classes
names: ['shrimp']  # class names
