<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrimp Pond Monitoring System</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent-blue: #2563eb;
            --accent-teal: #14b8a6;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1520px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1.28fr 1fr;
            gap: 28px;
            margin-bottom: 30px;
            align-items: stretch;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .comparison-section {
            padding: 24px;
        }

        .comparison-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .comparison-header h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .time-selector {
            position: relative;
        }

        .time-selector select {
            appearance: none;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 40px 10px 16px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .time-selector select:hover {
            border-color: var(--accent-blue);
        }

        .time-selector::after {
            content: '▼';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .image-comparison {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .day-row {
            display: contents;
        }

        .day-label {
            grid-column: span 2;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: -10px;
            margin-top: 10px;
        }

        .day-label:first-child {
            margin-top: 0;
        }

        .image-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .image-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
        }

        .image-placeholder {
            aspect-ratio: 1 / 1;
            min-height: 310px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 2px solid var(--accent-blue);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .image-placeholder:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .image-placeholder.ai {
            background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
            border-color: var(--accent-teal);
        }

        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #ffffff;
            transition: transform 0.25s ease;
        }

        .image-placeholder:hover img {
            transform: scale(1.02);
        }

        .image-icon {
            position: relative;
            width: 70%;
            height: 70%;
        }

        /* Mountain icon */
        .image-icon::before {
            content: '';
            position: absolute;
            bottom: 20%;
            left: 20%;
            width: 0;
            height: 0;
            border-left: 28px solid transparent;
            border-right: 28px solid transparent;
            border-bottom: 40px solid currentColor;
            opacity: 0.3;
        }

        /* Sun/circle icon */
        .image-icon::after {
            content: '';
            position: absolute;
            top: 15%;
            right: 20%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.3;
        }

        .image-placeholder.real .image-icon {
            color: var(--accent-blue);
        }

        .image-placeholder.ai .image-icon {
            color: var(--accent-teal);
        }

        .chart-section {
            padding: 24px;
        }

        .chart-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .chart-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chart-container {
            position: relative;
            height: 360px;
            padding: 20px 20px 40px 50px;
        }

        .chart-svg {
            width: 100%;
            height: 100%;
        }

        .chart-line {
            fill: none;
            stroke: var(--accent-teal);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chart-area {
            fill: url(#gradient);
            opacity: 0.2;
        }

        .chart-grid line {
            stroke: var(--border-color);
            stroke-width: 1;
        }

        .chart-axis {
            font-size: 11px;
            fill: var(--text-secondary);
            font-weight: 500;
        }

        .form-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            min-width: 140px;
        }

        .form-group input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: var(--bg-primary);
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: white;
        }

        .form-group input::placeholder {
            color: #9ca3af;
            font-family: 'IBM Plex Sans', sans-serif;
        }

        .print-button {
            grid-column: span 2;
            margin-top: 20px;
            padding: 14px 40px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
            justify-self: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .print-button:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transform: translateY(-1px);
        }

        .print-button:active {
            transform: translateY(0);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .doctor-button:hover {
            background: #059669;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transform: translateY(-1px);
        }

        .doctor-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .stats-card {
            margin-top: 20px;
            padding: 20px;
            background: var(--bg-primary);
            border-radius: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            text-align: center;
        }

        .stat-item h4 {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-item p {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent-teal);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #dc2626;
        }

        @media (max-width: 1100px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .chart-container {
                height: 300px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 16px 8px;
            }

            .card {
                padding: 18px;
            }

            .form-section {
                grid-template-columns: 1fr;
            }

            .image-comparison {
                grid-template-columns: 1fr;
            }

            .image-placeholder {
                min-height: 260px;
            }

            .day-label {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <!-- Left Panel: Image Comparison -->
            <div class="card comparison-section">
                <div class="comparison-header">
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 100%;">
                        <h3 style="text-align: center;">Real Image</h3>
                        <h3 style="text-align: center;">AI Image</h3>
                    </div>
                </div>
                
                <div class="image-comparison" id="imageComparison">
                    <!-- Images will be loaded dynamically -->
                    <div class="loading">Loading images...</div>
                </div>
            </div>

            <!-- Right Panel: Chart -->
            <div class="card chart-section">
                <div class="comparison-header">
                    <div style="flex: 1;"></div>
                    <div class="time-selector">
                        <select id="timePeriod">
                            <option value="days">Time Period in Days</option>
                            <option value="weeks">Time Period in Weeks</option>
                            <option value="months">Time Period in Months</option>
                        </select>
                    </div>
                </div>

                <div class="chart-header">
                    <h3>Comparison Analysis</h3>
                </div>

                <div class="chart-container">
                    <svg class="chart-svg" viewBox="0 0 500 300" id="chartSvg">
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.3" />
                                <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        <!-- Chart will be rendered by JavaScript -->
                    </svg>
                </div>

                <!-- Stats Card -->
                <div class="stats-card">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <h4>Total Shrimp</h4>
                            <p id="totalShrimp">-</p>
                        </div>
                        <div class="stat-item">
                            <h4>Avg Length</h4>
                            <p id="avgLength">-</p>
                        </div>
                        <div class="stat-item">
                            <h4>Images Processed</h4>
                            <p id="imagesProcessed">-</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Panel: Form -->
        <div class="card">
            <div class="form-section">
                <div class="form-group">
                    <label>Pond ID :</label>
                    <input type="text" id="pondId" placeholder="Enter Pond ID">
                </div>
                <div class="form-group">
                    <label>Device ID :</label>
                    <input type="text" id="deviceId" placeholder="Enter Device ID">
                </div>
                <div class="form-group">
                    <label>Time/ Cycle No :</label>
                    <input type="text" id="cycleNo" placeholder="Enter Cycle Number">
                </div>
                <div class="form-group">
                    <label>Shrimp Count :</label>
                    <input type="text" id="shrimpCount" placeholder="Auto-filled from AI" readonly>
                </div>
                <div class="form-group">
                    <label>Shrimp Length :</label>
                    <input type="text" id="shrimpLength" placeholder="Auto-filled from AI" readonly>
                </div>
                <div class="form-group">
                    <label>Shrimp Weight (avg) :</label>
                    <input type="text" id="shrimpWeight" placeholder="Auto-calculated from length" readonly>
                </div>
                <div class="form-group">
                    <label>Water Depth :</label>
                    <input type="text" id="waterDepth" placeholder="Enter Water Depth">
                </div>
                <div class="form-group full-width">
                    <label>Interpretation :</label>
                    <div style="display: flex; align-items: flex-start; gap: 12px; width: 100%;">
                        <textarea id="interpretation" placeholder="Click the Doctor button to generate AI-powered interpretation..." rows="3" style="flex: 1; min-width: 0; padding: 15px 20px; border: 1px solid var(--border-color); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--bg-primary); resize: vertical;"></textarea>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; width: 100%;">
                        <button type="button" class="doctor-button" id="doctorButton" style="background: #10b981; color: white; border: none; border-radius: 8px; padding: 15px 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;">
                            <span style="margin-right: 8px;">👨‍⚕️</span> Generate Interpretation
                        </button>
                        <div id="loadingIndicator" style="display: none; color: var(--text-secondary); font-size: 13px;">
                            <span style="display: inline-block; animation: spin 1s linear infinite; margin-right: 8px;">⏳</span> Generating interpretation...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAiImageId = null;
        let isLoadingImages = false;

        // Fetch and display images
        async function loadImages() {
            if (isLoadingImages) return;
            isLoadingImages = true;
            try {
                const response = await fetch('/api/images');
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('imageComparison').innerHTML = 
                        `<div class="error">Error: ${data.error}</div>`;
                    return;
                }

                // Build image comparison HTML
                let html = '';
                
                // DAY 1
                html += '<div class="day-label">DAY 1 :</div>';
                if (data.real_images[0]) {
                    html += `
                        <div class="image-group">
                            <div class="image-placeholder real" onclick="openImageModal('${data.real_images[0].data}', 'Real Image - Day 1')" title="Click to inspect checktray">
                                <img src="${data.real_images[0].data}" alt="Real Image Day 1">
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="image-group">
                            <div class="image-placeholder real">
                                <div class="image-icon"></div>
                            </div>
                        </div>
                    `;
                }
                
                if (data.ai_images[0]) {
                    currentAiImageId = data.ai_images[0].id;
                    html += `
                        <div class="image-group">
                            <div class="image-placeholder ai" onclick="openImageModal('${data.ai_images[0].data}', 'AI Detection - Day 1')" title="Click to inspect bounding boxes and lengths">
                                <img src="${data.ai_images[0].data}" alt="AI Image Day 1">
                            </div>
                        </div>
                    `;
                    // Auto-fill form fields from database
                    document.getElementById('shrimpCount').value = data.ai_images[0].shrimp_count || '';
                    document.getElementById('shrimpLength').value = data.ai_images[0].avg_length_cm ? 
                        data.ai_images[0].avg_length_cm + ' cm' : '';
                    document.getElementById('shrimpWeight').value = data.ai_images[0].avg_weight_g ? 
                        data.ai_images[0].avg_weight_g + ' g' : '';
                    document.getElementById('pondId').value = data.ai_images[0].pond_id || '';
                    document.getElementById('deviceId').value = data.ai_images[0].device_id || '';
                    document.getElementById('cycleNo').value = data.ai_images[0].cycle_no || '';
                    document.getElementById('waterDepth').value = data.ai_images[0].water_depth_m ? 
                        data.ai_images[0].water_depth_m + ' m' : '';
                } else {
                    html += `
                        <div class="image-group">
                            <div class="image-placeholder ai">
                                <div class="image-icon"></div>
                            </div>
                        </div>
                    `;
                }

                // DAY 7 (or second image)
                html += '<div class="day-label">DAY 7 :</div>';
                if (data.real_images[1]) {
                    html += `
                        <div class="image-group">
                            <div class="image-placeholder real" onclick="openImageModal('${data.real_images[1].data}', 'Real Image - Day 7')" title="Click to inspect checktray">
                                <img src="${data.real_images[1].data}" alt="Real Image Day 7">
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="image-group">
                            <div class="image-placeholder real">
                                <div class="image-icon"></div>
                            </div>
                        </div>
                    `;
                }
                
                if (data.ai_images[1]) {
                    html += `
                        <div class="image-group">
                            <div class="image-placeholder ai" onclick="openImageModal('${data.ai_images[1].data}', 'AI Detection - Day 7')" title="Click to inspect bounding boxes and lengths">
                                <img src="${data.ai_images[1].data}" alt="AI Image Day 7">
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="image-group">
                            <div class="image-placeholder ai">
                                <div class="image-icon"></div>
                            </div>
                        </div>
                    `;
                }

                document.getElementById('imageComparison').innerHTML = html;

                // Render chart
                renderChart(data.chart_data);
                
                // Update stats
                updateStats(data);
                
            } catch (error) {
                console.error('Error loading images:', error);
                document.getElementById('imageComparison').innerHTML = 
                    `<div class="error">Failed to load images</div>`;
            } finally {
                isLoadingImages = false;
            }
        }

        // Render chart using SVG
        function renderChart(chartData) {
            if (!chartData || chartData.length === 0) {
                return;
            }

            const svg = document.getElementById('chartSvg');
            const width = 500;
            const height = 300;
            const padding = { top: 20, right: 20, bottom: 40, left: 50 };
            
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            const maxCount = Math.max(...chartData.map(d => d.count), 100);
            const maxDay = Math.max(...chartData.map(d => d.day), 5);
            
            // Generate path for line
            let pathD = '';
            let areaD = '';
            
            chartData.forEach((point, index) => {
                const x = padding.left + (point.day / maxDay) * chartWidth;
                const y = padding.top + chartHeight - (point.count / maxCount) * chartHeight;
                
                if (index === 0) {
                    pathD += `M ${x} ${y}`;
                    areaD += `M ${x} ${padding.top + chartHeight} L ${x} ${y}`;
                } else {
                    pathD += ` L ${x} ${y}`;
                    areaD += ` L ${x} ${y}`;
                }
            });
            
            areaD += ` L ${padding.left + chartWidth} ${padding.top + chartHeight} Z`;
            
            // Create SVG content
            let svgContent = `
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.3" />
                        <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0" />
                    </linearGradient>
                </defs>
                
                <!-- Grid lines -->
                <g class="chart-grid">
                    ${[0, 25, 50, 75, 100].map(val => {
                        const y = padding.top + chartHeight - (val / 100) * chartHeight;
                        return `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" />`;
                    }).join('')}
                </g>
                
                <!-- Y-axis labels -->
                <g class="chart-axis">
                    ${[0, 25, 50, 75, 100].map(val => {
                        const y = padding.top + chartHeight - (val / 100) * chartHeight;
                        return `<text x="${padding.left - 10}" y="${y + 4}" text-anchor="end">${val}</text>`;
                    }).join('')}
                </g>
                
                <!-- X-axis labels -->
                <g class="chart-axis">
                    ${chartData.map(d => {
                        const x = padding.left + (d.day / maxDay) * chartWidth;
                        return `<text x="${x}" y="${height - 10}" text-anchor="middle">DAY ${d.day}</text>`;
                    }).join('')}
                </g>
                
                <!-- Area fill -->
                <path class="chart-area" d="${areaD}" />
                
                <!-- Line -->
                <path class="chart-line" d="${pathD}" />
            `;
            
            svg.innerHTML = svgContent;
        }

        // Update statistics
        function updateStats(data) {
            const totalShrimp = data.ai_images.reduce((sum, img) => sum + (img.shrimp_count || 0), 0);
            const avgLength = data.ai_images.length > 0 
                ? (data.ai_images.reduce((sum, img) => sum + (img.avg_length_cm || 0), 0) / data.ai_images.length).toFixed(2)
                : '-';
            const avgWeight = data.ai_images.length > 0 
                ? (data.ai_images.reduce((sum, img) => sum + (img.avg_weight_g || 0), 0) / data.ai_images.length).toFixed(2)
                : '-';
            
            document.getElementById('totalShrimp').textContent = totalShrimp || '-';
            document.getElementById('avgLength').textContent = avgLength !== '-' ? avgLength + ' cm' : '-';
            document.getElementById('imagesProcessed').textContent = data.ai_images.length || '-';
            
            // Also update weight field if not already set
            if (data.ai_images[0] && data.ai_images[0].avg_weight_g) {
                document.getElementById('shrimpWeight').value = data.ai_images[0].avg_weight_g + ' g';
            }
        }

        // Load images on page load
        document.addEventListener('DOMContentLoaded', loadImages);
        
        // Auto-refresh images every 15 seconds (without page reload)
        setInterval(loadImages, 15000);
        
        // Add manual refresh button functionality
        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' || e.key === 'R') {
                loadImages();
            }
        });

        // Doctor button - Generate LLM interpretation
        document.getElementById('doctorButton').addEventListener('click', async function() {
            const button = this;
            const loadingIndicator = document.getElementById('loadingIndicator');
            const interpretationBox = document.getElementById('interpretation');
            
            // Disable button and show loading
            button.disabled = true;
            loadingIndicator.style.display = 'block';
            interpretationBox.placeholder = 'Generating interpretation...';
            
            try {
                const response = await fetch('/api/generate-interpretation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        template_type: 'main',  // Use main template by default
                        ai_image_id: currentAiImageId
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Success - display interpretation
                    interpretationBox.value = data.interpretation;
                    interpretationBox.placeholder = '';
                    
                    // Visual feedback
                    interpretationBox.style.borderColor = '#10b981';
                    setTimeout(() => {
                        interpretationBox.style.borderColor = '#e5e7eb';
                    }, 2000);
                } else {
                    // Error - show fallback or error message
                    if (data.fallback) {
                        interpretationBox.value = "⚠️ Using fallback analysis:\n\n" + data.fallback;
                    } else {
                        interpretationBox.value = "❌ Error: " + (data.error || 'Failed to generate interpretation');
                    }
                }
                
            } catch (error) {
                console.error('Error generating interpretation:', error);
                interpretationBox.value = "❌ Connection error: " + error.message + "\n\nMake sure Ollama server is running with: ollama serve";
            } finally {
                // Re-enable button and hide loading
                button.disabled = false;
                loadingIndicator.style.display = 'none';
            }
        });
    
        function openImageModal(src, title) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');
            if (modal && modalImg) {
                modalImg.src = src;
                if (modalCaption) modalCaption.textContent = title || '';
                modal.style.display = 'flex';
            }
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            if (modal) modal.style.display = 'none';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeImageModal();
        });

    </script>

    <!-- Lightbox Modal for Fullscreen Checktray Inspection -->
    <div id="imageModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); align-items: center; justify-content: center; cursor: zoom-out;" onclick="closeImageModal()">
        <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;" onclick="event.stopPropagation();">
            <img id="modalImg" src="" alt="Enlarged Checktray" style="max-width: 88vw; max-height: 84vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); object-fit: contain; background: #000;">
            <div id="modalCaption" style="color: #fff; margin-top: 12px; font-size: 14px; font-weight: 500; font-family: 'IBM Plex Sans', sans-serif;"></div>
            <button onclick="closeImageModal()" style="position: absolute; top: -16px; right: -16px; width: 36px; height: 36px; border-radius: 50%; background: #ffffff; color: #1a1a1a; border: none; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;">&times;</button>
        </div>
    </div>

</body>
</html>
